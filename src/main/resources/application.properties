spring.application.name=DrivenFear

qiniu.access-key=${QINIU_ACCESS_KEY}
qiniu.secret-key=${QINIU_SECRET_KEY}
qiniu.bucket-name=tiaaolinrg-powerfulempathy
qiniu.domain=https://static.sakiprime.cn/

aimodelconfig.text.default-key=DeepSeekV4-flash
aimodelconfig.text.default-value=20
aimodelconfig.image.default-key=doubao-seedream-5.0-lite
aimodelconfig.image.default-value=60
aimodelconfig.video.default-key=doubao-seedance-2-0-260128
aimodelconfig.video.default-value=500

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/drivenfear?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
spring.datasource.username=pema_user
spring.datasource.password=${DB_PASSWORD}

mybatis-plus.global-config.db-config.update-strategy=not_null

server.port=8523

ollama.api.model=gemma4-fast:latest


spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=1
spring.data.redis.timeout=10000ms


sa-token.dao-type=redis
sa-token.token-name=satoken
sa-token.timeout=2592000
sa-token.cookie.httpOnly=true
sa-token.cookie.secure=true
sa-token.cookie.sameSite=Lax


spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=/

spring.rabbitmq.connection-timeout=10000
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.concurrency=2
spring.rabbitmq.listener.simple.max-concurrency=4
spring.rabbitmq.listener.simple.prefetch=5
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

aliyun.dm.accessKeyId=${ALIYUN_DM_ACCESS_KEY_ID}
aliyun.dm.accessKeySecret=${ALIYUN_DM_ACCESS_KEY_SECRET}
aliyun.dm.accountName=no-reply@mail.sakiprime.cn
aliyun.dm.endpoint=dm.aliyuncs.com

alipay.app-id=${ALIPAY_APP_ID}
alipay.merchant-private-key=${ALIPAY_MERCHANT_PRIVATE_KEY}
alipay.alipay-public-key=${ALIPAY_PUBLIC_KEY}
alipay.notify-url=${ALIPAY_NOTIFY_URL}

spring.config.import=optional:file:.env.local.properties